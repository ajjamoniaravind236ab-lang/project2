<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Analytics | Login</title>
    <link rel="stylesheet" href="loginpage.css">
</head>
<body>

    <div class="login-container">
        <div class="login-info">
            <h1>Student Analytics</h1>
            <h2>Welcome Back!</h2>
            <p>
                Track your academic progress, analyze your performance,
                and achieve your goals with AI-powered insights.
            </p>
        </div>

        <div class="login-form">
            <h2>Login to Your Account</h2>
            <p class="subtitle">Enter your details to continue</p>
we
            <form id="loginForm" action="frontend.html" >
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" id="loginButton" >Login</button>

                <p id="message" role="alert"></p>
            </form>

            <p class="register-link">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
        </div>
    </div>

    <script src="loginpage.j"></script>
    <script src="connect.j" ></script>
</body>
</html>
